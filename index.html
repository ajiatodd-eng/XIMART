<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XIMART — Multi-User & Owner Dashboard</title>
    <!-- Font & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js untuk Grafik Keuangan -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-base: #0b0f17;
            --bg-surface: #131b2e;
            --bg-card: rgba(23, 32, 54, 0.75);
            --bg-card-hover: rgba(30, 42, 69, 0.85);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-active: rgba(56, 189, 248, 0.4);

            --accent-cyan: #38bdf8;
            --accent-cyan-soft: rgba(56, 189, 248, 0.12);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #64748b;

            --p1-green: #10b981;
            --p1-bg: rgba(16, 185, 129, 0.12);
            --p3-red: #ef4444;
            --p3-bg: rgba(239, 68, 68, 0.12);

            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-soft: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --transition-fast: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 90px;
        }

        .app-header {
            width: 100%;
            max-width: 480px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: rgba(11, 15, 23, 0.85);
            backdrop-filter: blur(12px);
            z-index: 100;
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-badge {
            background: var(--accent-cyan-soft);
            color: var(--accent-cyan);
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 20px;
            border: 1px solid var(--border-active);
            font-weight: 600;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 18px;
            backdrop-filter: blur(16px);
            box-shadow: var(--shadow-soft);
        }

        .wallet-card {
            background: linear-gradient(135deg, rgba(19, 27, 46, 0.9) 0%, rgba(30, 42, 69, 0.6) 100%);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .balance-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
        .balance-value { font-size: 1.7rem; font-weight: 700; color: var(--text-main); margin-bottom: 14px; }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-title { font-size: 0.95rem; font-weight: 600; color: var(--text-main); }

        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }

        .menu-item-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-info { display: flex; flex-direction: column; }
        .menu-title { font-size: 0.9rem; font-weight: 600; }
        .menu-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.25);
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
        }

        .qty-btn {
            background: none;
            border: none;
            color: var(--accent-cyan);
            font-weight: 700;
            font-size: 1.1rem;
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-val { font-size: 0.85rem; font-weight: 600; min-width: 16px; text-align: center; }

        .primary-action-btn {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: #0b0f17;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 14px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.3);
            margin-top: 10px;
        }

        .secondary-btn {
            background: var(--bg-surface);
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .input-group label { font-size: 0.75rem; color: var(--text-muted); }
        .input-control {
            background: var(--bg-base);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            outline: none;
        }

        .order-card-item {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 12px;
            margin-bottom: 10px;
        }

        .nav-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(11, 15, 23, 0.92);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            justify-content: center;
            z-index: 90;
        }

        .nav-container { width: 100%; max-width: 480px; display: flex; justify-content: space-around; padding: 10px 0; }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: var(--text-dim); font-size: 0.7rem; background: none; border: none; cursor: pointer;
        }
        .nav-item.active { color: var(--accent-cyan); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 15, 23, 0.8); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; padding: 20px;
            z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-body {
            background: var(--bg-surface); border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg); width: 100%; max-width: 400px; padding: 20px;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="brand-title">
            XIMART <span class="brand-badge" id="role-badge">USER (ORANG A)</span>
        </div>
        <button class="secondary-btn" onclick="toggleRole()">Ganti Mode Owner</button>
    </header>

    <div class="container">

        <!-- ===== TAMPILAN USER (PEMESANAN) ===== -->
        <div id="view-user">
            <div class="card">
                <div class="section-title" style="margin-bottom: 12px;">Identitas Pemesan</div>
                <div class="input-group">
                    <label>Nama Anda (Orang A / B / C)</label>
                    <input type="text" id="user-name" class="input-control" value="Orang A" placeholder="Masukkan nama Anda">
                </div>
                <div class="input-group">
                    <label>Nomor WhatsApp (Aktif untuk Notifikasi)</label>
                    <input type="text" id="user-wa" class="input-control" value="6281234567890" placeholder="628xxxxxxxxxx">
                </div>
            </div>

            <div class="card" style="margin-top: 12px;">
                <div class="section-header">
                    <div class="section-title">Pilih Menu Sarapan / Harian</div>
                </div>
                <div class="menu-grid" id="user-menu-list"></div>
            </div>

            <div class="card" style="margin-top: 12px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <span style="font-size: 0.85rem; color: var(--text-muted);">Total Belanja</span>
                    <span style="font-size: 1.1rem; font-weight: 700; color: var(--accent-cyan);" id="user-total-price">Rp 0</span>
                </div>
                <button class="primary-action-btn" onclick="submitOrder()">Kirim Pesanan ke Owner</button>
            </div>
        </div>

        <!-- ===== TAMPILAN DASHBOARD OWNER ===== -->
        <div id="view-owner" style="display: none;">
            <!-- Saldo Dompet Owner -->
            <div class="card wallet-card">
                <div class="balance-label">Dompet Operasional Owner</div>
                <div class="balance-value" id="owner-saldo">Rp 0</div>
                <button class="secondary-btn" onclick="openModal('modal-topup')">+ Top Up Saldo Dompet</button>
            </div>

            <!-- Daftar Pesanan Masuk (Pending) -->
            <div class="card" style="margin-top: 12px;">
                <div class="section-header">
                    <div class="section-title">📦 Pesanan Belum Dibeli (Pending)</div>
                    <button class="secondary-btn" onclick="fetchDashboardData()">Refresh</button>
                </div>
                <div id="owner-orders-container">
                    <p style="font-size: 0.8rem; color: var(--text-muted);">Memuat pesanan...</p>
                </div>
            </div>

            <!-- Grafik Keuangan -->
            <div class="card" style="margin-top: 12px;">
                <div class="section-title" style="margin-bottom: 10px;">📊 Tren Keuangan</div>
                <canvas id="financeChart" style="max-height: 200px;"></canvas>
            </div>
        </div>

    </div>

    <!-- Navigasi Bawah -->
    <nav class="nav-bar">
        <div class="nav-container">
            <button class="nav-item active" onclick="switchTab('user')" id="nav-user">
                <span>🛒</span><span>Pesan Menu</span>
            </button>
            <button class="nav-item" onclick="switchTab('owner')" id="nav-owner">
                <span>👑</span><span>Dashboard Owner</span>
            </button>
        </div>
    </nav>

    <!-- Modal Top Up -->
    <div class="modal-overlay" id="modal-topup">
        <div class="modal-body">
            <div class="section-title" style="margin-bottom: 12px;">Top Up Saldo Dompet Owner</div>
            <div class="input-group">
                <label>Nominal (Rp)</label>
                <input type="number" id="input-topup" class="input-control" placeholder="50000">
            </div>
            <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px;">
                <button class="secondary-btn" onclick="closeModal('modal-topup')">Batal</button>
                <button class="primary-action-btn" style="width: auto; margin-top: 0;" onclick="executeTopUp()">Isi Saldo</button>
            </div>
        </div>
    </div>

    <!-- Modal Sold / Kendala -->
    <div class="modal-overlay" id="modal-sold">
        <div class="modal-body">
            <div class="section-title" style="margin-bottom: 12px;">Konfirmasi Kendala / Sold</div>
            <input type="hidden" id="sold-row">
            <div class="input-group">
                <label>Catatan untuk Pemesan (Misal: Stok warung habis)</label>
                <input type="text" id="sold-note" class="input-control" placeholder="Menu sudah habis...">
            </div>
            <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px;">
                <button class="secondary-btn" onclick="closeModal('modal-sold')">Batal</button>
                <button class="primary-action-btn" style="width: auto; margin-top: 0; background: var(--p3-red); color: #fff;" onclick="submitSoldOrder()">Kirim Notifikasi Sold</button>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ MASUKKAN URL WEB APP ANDA DI SINI
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyYbGuWpwcsYk83gHWDd44Ls_7Gp6pMVwFLTR-6ITPPnpML_yRESkBLGyWzeP_VjL6x/exec";

        const menuItems = [
            { id: 'm1', name: 'Nasi Uduk', price: 8000, qty: 0 },
            { id: 'm2', name: 'Nasi Kuning', price: 8000, qty: 0 },
            { id: 'm3', name: 'Telur Bulat/Dadar', price: 5000, qty: 0 },
            { id: 'm4', name: 'Bakwan', price: 1500, qty: 0 },
            { id: 'm5', name: 'Tempe Goreng', price: 1000, qty: 0 },
            { id: 'm6', name: 'Lontong', price: 1500, qty: 0 },
            { id: 'm7', name: 'Risol Mayo', price: 3000, qty: 0 }
        ];

        let currentRole = 'user'; // 'user' atau 'owner'
        let financeChartInstance = null;

        window.onload = function() {
            renderUserMenu();
        };

        function renderUserMenu() {
            const container = document.getElementById('user-menu-list');
            container.innerHTML = '';
            let total = 0;

            menuItems.forEach(item => {
                total += item.price * item.qty;
                const card = document.createElement('div');
                card.className = 'menu-item-card';
                card.innerHTML = `
                    <div class="menu-info">
                        <span class="menu-title">${item.name}</span>
                        <span class="menu-sub">Rp ${item.price.toLocaleString('id-ID')}</span>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="updateQty('${item.id}', -1)">-</button>
                        <span class="qty-val">${item.qty}</span>
                        <button class="qty-btn" onclick="updateQty('${item.id}', 1)">+</button>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('user-total-price').innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        function updateQty(id, delta) {
            const item = menuItems.find(m => m.id === id);
            if (item) {
                item.qty = Math.max(0, item.qty + delta);
                renderUserMenu();
            }
        }

        function switchTab(tab) {
            currentRole = tab;
            document.getElementById('view-user').style.display = tab === 'user' ? 'block' : 'none';
            document.getElementById('view-owner').style.display = tab === 'owner' ? 'block' : 'none';
            document.getElementById('nav-user').classList.toggle('active', tab === 'user');
            document.getElementById('nav-owner').classList.toggle('active', tab === 'owner');
            document.getElementById('role-badge').innerText = tab === 'user' ? 'USER (PESAN)' : 'OWNER (KENDALI)';

            if (tab === 'owner') {
                fetchDashboardData();
            }
        }

        function toggleRole() {
            if (currentRole === 'user') switchTab('owner');
            else switchTab('user');
        }

        // Kirim Pesanan User ke Google Sheets
        async function submitOrder() {
            const nama = document.getElementById('user-name').value.trim();
            const wa = document.getElementById('user-wa').value.trim();
            if (!nama || !wa) return alert("Mohon isi Nama dan Nomor WhatsApp Anda.");

            let rincian = [];
            let total = 0;
            menuItems.forEach(i => {
                if (i.qty > 0) {
                    rincian.push(`${i.name} x${i.qty}`);
                    total += i.price * i.qty;
                }
            });

            if (total === 0) return alert("Pilih minimal 1 menu pesanan.");

            alert("Mengirim pesanan ke sistem Owner...");

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'createOrder',
                        nama: nama,
                        wa: wa,
                        kategori: 'Sarapan',
                        menu: rincian.join(', '),
                        total: total
                    })
                });
                const result = await response.json();
                if (result.status === 'success') {
                    alert("Pesanan berhasil dikirim ke Owner!");
                    menuItems.forEach(i => i.qty = 0);
                    renderUserMenu();
                } else {
                    alert("Gagal mengirim pesanan.");
                }
            } catch (err) {
                alert("Terjadi kesalahan koneksi ke server.");
            }
        }

        // Ambil Data Dashboard Owner
        async function fetchDashboardData() {
            document.getElementById('owner-orders-container').innerHTML = '<p style="font-size: 0.8rem; color: var(--text-muted);">Memuat data...</p>';
            try {
                const res = await fetch(`${WEB_APP_URL}?action=getDashboard`);
                const data = await res.json();
                
                if (data.status === 'success') {
                    document.getElementById('owner-saldo').innerText = `Rp ${Number(data.saldo).toLocaleString('id-ID')}`;
                    renderPendingOrders(data.pendingOrders);
                    renderFinanceChart(data.financeLogs);
                }
            } catch (err) {
                document.getElementById('owner-orders-container').innerHTML = '<p style="font-size: 0.8rem; color: var(--p3-red);">Gagal memuat data dari Spreadsheet.</p>';
            }
        }

        function renderPendingOrders(orders) {
            const container = document.getElementById('owner-orders-container');
            container.innerHTML = '';

            if (orders.length === 0) {
                container.innerHTML = '<p style="font-size: 0.8rem; color: var(--text-muted);">Tidak ada pesanan pending saat ini.</p>';
                return;
            }

            orders.forEach(ord => {
                const div = document.createElement('div');
                div.className = 'order-card-item';
                div.innerHTML = `
                    <div style="display: flex; justify-content: space-between; font-weight: 600; font-size: 0.85rem; margin-bottom: 4px;">
                        <span>👤 ${ord.nama}</span>
                        <span style="color: var(--accent-cyan);">Rp ${Number(ord.total).toLocaleString('id-ID')}</span>
                    </div>
                    <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px;">📦 ${ord.menu} (${ord.waktu})</div>
                    <div style="display: flex; gap: 6px;">
                        <button class="secondary-btn" style="flex: 1; background: var(--p1-bg); color: var(--p1-green); border-color: rgba(16,185,129,0.3);" onclick="updateOrderStatus(${ord.row}, 'SELESAI')">✅ Selesai (Beli & Kirim WA)</button>
                        <button class="secondary-btn" style="background: var(--p3-bg); color: var(--p3-red); border-color: rgba(239,68,68,0.3);" onclick="openSoldModal(${ord.row})">⚠️ Sold</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // Aksi Owner: Pesanan Selesai
        async function updateOrderStatus(row, status, catatan = '') {
            if (status === 'SELESAI' && !confirm("Konfirmasi pesanan ini sudah dibeli? Saldo dompet Owner akan terpotong dan WhatsApp otomatis terkirim ke pemesan.")) return;

            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'updateOrderStatus',
                        row: row,
                        status: status,
                        catatan: catatan
                    })
                });
                const result = await res.json();
                if (result.status === 'success') {
                    alert("Status pesanan diperbarui & notifikasi WhatsApp terkirim!");
                    fetchDashboardData();
                } else {
                    alert("Gagal memperbarui status.");
                }
            } catch (err) {
                alert("Kesalahan koneksi.");
            }
        }

        function openSoldModal(row) {
            document.getElementById('sold-row').value = row;
            openModal('modal-sold');
        }

        function submitSoldOrder() {
            const row = document.getElementById('sold-row').value;
            const note = document.getElementById('sold-note').value;
            closeModal('modal-sold');
            updateOrderStatus(row, 'SOLD', note);
        }

        async function executeTopUp() {
            const amount = parseInt(document.getElementById('input-topup').value);
            if (isNaN(amount) || amount <= 0) return alert("Nominal tidak valid.");

            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'topUp', nominal: amount })
                });
                const result = await res.json();
                if (result.status === 'success') {
                    alert("Top Up Berhasil!");
                    closeModal('modal-topup');
                    document.getElementById('input-topup').value = '';
                    fetchDashboardData();
                }
            } catch (err) {
                alert("Gagal Top Up.");
            }
        }

        function renderFinanceChart(logs) {
            const ctx = document.getElementById('financeChart').getContext('2d');
            if (financeChartInstance) financeChartInstance.destroy();

            let totalIn = 0;
            let totalOut = 0;

            logs.forEach(l => {
                if (l.tipe === 'PEMASUKAN') totalIn += Number(l.nominal);
                if (l.tipe === 'PENGELUARAN') totalOut += Number(l.nominal);
            });

            financeChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Pemasukan (Top Up)', 'Pengeluaran (Belanja)'],
                    datasets: [{
                        label: 'Rupiah (Rp)',
                        data: [totalIn, totalOut],
                        backgroundColor: ['#10b981', '#ef4444'],
                        borderWidth: 0,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        x: { ticks: { color: '#94a3b8' }, grid: { display: false } }
                    }
                }
            });
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    </script>
</body>
</html>
